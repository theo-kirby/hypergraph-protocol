# Per-skill reference sets: which files from the shared references payload each
# skill's references/ receives at `hypergraph skills install`.
#
# In this checkout the same sets exist as the dogfooding symlinks under
# skills/*/references/ — those stay authoritative. A wheel cannot carry
# symlinks, so it carries this manifest in their place;
# test_manifest_matches_the_dogfooding_symlinks pins the two representations
# equal, so editing one without the other fails the suite.
hypergraph-adopt: [agents-block.md, config.example.yml, local-adapter.md, record-node.md, spec.md, state-node.md]
hypergraph-dispatch: [lanes.md, local-adapter.md, spec.md]
hypergraph-init: [config.example.yml, local-adapter.md, record-node.md, spec.md, state-node.md]
hypergraph-orient: [local-adapter.md, spec.md]
hypergraph-reconcile: [local-adapter.md, record-node.md, spec.md, state-node.md]
hypergraph-record: [local-adapter.md, record-node.md, spec.md]
