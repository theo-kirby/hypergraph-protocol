# Hypergraph per-project config — written by hypergraph-init (2026-08-06).
project: hypergraph-protocol

# The release whose skills/AGENTS.md block this project carries. Here it is always
# the release in the tree: `.claude/skills/hypergraph-*` are symlinks into `skills/`,
# so there are no copies to go stale — which is also why `hypergraph upgrade` refuses
# to run in this checkout. `tests/test_packaging.py` holds this in step with
# `__version__` so a release cannot leave it behind.
hypergraph_version: 0.0.11

record_root:
  node_id: cdbea53e-8865-5138-b033-948b4690daf3
  slug: autumn-tooth-6046

state_root:
  node_id: 9e687be1-1c80-56a2-bc0c-d4476edc0a2e
  slug: cool-king-8586

cache_dir: .hypergraph/cache

state_md: STATE.md

# Backend adapter the skills dispatch on (backend/INTERFACE.md).
# local: the node files under graph_dir are the source of truth (offline, in-repo).
# mirror: Flywheel stays a regenerable projection, refreshed after each reconcile.
graph_dir: .hypergraph/graph

# Optional viz settings — display configuration for external visualization tooling
# (hypergraph-viz); core never reads it and no invariant does either.
#
# viz:
#   blob:
#     padding: 15
#     smoothing: 18

# Optional one-way mirror (backend/mirror.md). Absent → `push` is a no-op, exit 0.
# `mirror_account_id` is the account that owns the mirror roots: without it, a run
# with a key from a different account reports "the graph is missing" instead of
# "wrong account", which cost this project two rounds [rec: solemn-dawn-6752].
mirror: flywheel
mirror_account_id: be9833b0-502f-477a-ad2d-07dd5c871e10
