# .hypergraph/config.yml — written by hypergraph-init, read by all skills + tools.
project: my-project

record_root:
  node_id: 00000000-0000-0000-0000-000000000000
  slug: adjective-noun-0000

state_root:
  node_id: 00000000-0000-0000-0000-000000000000
  slug: adjective-noun-0000

# Where reconcile saves graph exports for the checker/renderer (gitignored).
cache_dir: .hypergraph/cache

# Generated state snapshot (committed; never hand-edited).
state_md: STATE.md

# Which backend adapter the skills follow (backend/INTERFACE.md). This is the live
# dispatch key: every skill reads it and follows the matching reference doc.
#
#   local     — markdown node files in this repo are the source of truth
#               (backend/local-adapter.md). No MCP, no account; the graphs travel
#               with the repo and `hypergraph export` feeds check/render/viz.
#   flywheel  — Flywheel MCP is the source of truth (backend/flywheel-adapter.md).
#               Recommended when you want hosting and cloud agents.
backend: local

# Where the local backend keeps node files (committed). `local` backend only.
graph_dir: .hypergraph/graph

# Optional: mirror the local graphs into a hosted store. With `backend: local` and
# `mirror: flywheel`, local stays canonical and Flywheel is a regenerable projection
# refreshed via `hypergraph push --plan` → skill executes → `push --record-result`.
# mirror: flywheel

# Optional: adoption epoch (SPEC: Adoption epochs). Record nodes created strictly
# before the marker node are legacy history, exempt from I2/template compliance in
# `check`. Written by hypergraph-adopt.
# epoch:
#   marker: adjective-noun-0000

# Optional: fresh mirror roots minted for an adopted project's post-epoch nodes
# (the archive holds the legacy mirror). Exempt from push --verify's
# no-local-counterpart check; the skill layer parents mirror pushes here.
# mirror_roots:
#   record:
#     node_id: 00000000-0000-0000-0000-000000000000
#     slug: adjective-noun-0000
#   state:
#     node_id: 00000000-0000-0000-0000-000000000000
#     slug: adjective-noun-0000

# Optional (mandatory for mode-A adoptions): where the pre-adoption graph lives.
# Purely documentary — the checker doesn't read it — but it is the only pointer to
# legacy artifacts, which do not survive import to the local backend.
# archive:
#   backend: flywheel
#   roots:
#     - node_id: 00000000-0000-0000-0000-000000000000
#       slug: adjective-noun-0000
#   note: frozen pre-adoption graph; artifacts live here
