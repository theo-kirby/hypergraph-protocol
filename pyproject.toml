# Dev-environment definition only (uv run pytest tests/). Hypergraph v0.0.1 is a
# protocol + skills + single-file script, not an installable package.
[project]
name = "hypergraph-dev"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.uv]
package = false
