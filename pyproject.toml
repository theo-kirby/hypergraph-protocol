# Package definition for the hypergraph-protocol distribution. The tool is two
# files: the offline core (tools/hypergraph.py, also runnable directly via uv,
# shipped as the module `hypergraph_protocol` with a `hypergraph` entry point)
# and the optional mirror's networked half (tools/hypergraph_mirror.py, shipped
# beside it as `hypergraph_protocol_mirror`), which the core loads lazily and
# offline commands never import.
[project]
name = "hypergraph-protocol"
version = "0.0.11"
description = "Hypergraph: a substrate for autonomous research and engineering. Two graphs per project — an append-only record graph of what happened, and a single-writer state graph of what is true now, each claim citing the evidence it rests on. Checker, STATE.md renderer, local git-native backend, dispatch lanes; optional mirror in a separate lazily-loaded module."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/theo-kirby/hypergraph-protocol"

[project.scripts]
hypergraph = "hypergraph_protocol:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
]

# `live` marks tests that write to a real hosted mirror. They are double
# env-gated on top of this marker; CI runs `pytest -m "not live"`.
[tool.pytest.ini_options]
markers = ["live: writes to a real hosted mirror (double env-gated)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The skills ship as package data next to the module; `hypergraph skills install`
# copies them into ./.claude/skills (or ~/.claude/skills with --user). Symlinked
# references/ entries are materialized as real files at build time.
[tool.hatch.build.targets.wheel.force-include]
"tools/hypergraph.py" = "hypergraph_protocol.py"
"tools/hypergraph_mirror.py" = "hypergraph_protocol_mirror.py"
"skills" = "hypergraph_protocol_data/skills"
"templates" = "hypergraph_protocol_data/templates"

[tool.hatch.build.targets.sdist]
include = ["tools/hypergraph.py", "tools/hypergraph_mirror.py",
           "README.md", "SPEC.md", "LICENSE", "pyproject.toml",
           "skills", "templates", "backend"]
# `.claude/skills/hypergraph-*` are committed symlinks into `skills/` — the dogfooding
# install. Hatchling walks with `followlinks=True` and skips any directory whose
# (st_dev, st_ino) it has already seen, so it materialized the skills under `.claude/`
# and then dropped the real `skills/` tree as a duplicate: an sdist with no `skills/`
# at all, whose wheel build then fails on the force-include of it.
#
# `exclude` alone does NOT fix that. It filters files out of the *output*, but the
# walker still descends and still marks the inodes — so both copies disappear. The
# directory has to be pruned before descent, which is what `skip-excluded-dirs` does.
# Keep both lines together; either one alone produces a broken release.
skip-excluded-dirs = true
exclude = ["/.claude", "/research"]

[tool.uv]
package = false
