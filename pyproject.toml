# Package definition for the hypergraph-protocol distribution. The tool stays a
# single file (tools/hypergraph.py, also runnable directly via uv); the wheel
# ships it as the module `hypergraph_protocol` with a `hypergraph` entry point.
[project]
name = "hypergraph-protocol"
version = "0.0.1"
description = "Hypergraph: a two-graph protocol (append-only record graph + distilled state graph) for keeping research projects legible to fresh agents. Checker, STATE.md renderer, and interactive visualizer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/theo-kirby/hypergraph-protocol"

[project.scripts]
hypergraph = "hypergraph_protocol:main"

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"tools/hypergraph.py" = "hypergraph_protocol.py"

[tool.hatch.build.targets.sdist]
include = ["tools/hypergraph.py", "README.md", "SPEC.md", "pyproject.toml"]

[tool.uv]
package = false
