# Package definition for the hypergraph-protocol distribution. The tool stays a
# single file (tools/hypergraph.py, also runnable directly via uv); the wheel
# ships it as the module `hypergraph_protocol` with a `hypergraph` entry point.
[project]
name = "hypergraph-protocol"
version = "0.0.8"
description = "Hypergraph: a substrate for autonomous research and engineering. Two graphs per project — an append-only record graph of what happened, and a single-writer state graph of what is true now, each claim citing the evidence it rests on. Checker, STATE.md renderer, and interactive visualizer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/theo-kirby/hypergraph-protocol"

[project.scripts]
hypergraph = "hypergraph_protocol:main"

[dependency-groups]
# numpy is for the benchmark lab's fidelity evaluator only. It is a *dev* group
# member, so it never reaches the distribution — the wheel and sdist ship from
# the explicit allow-lists below, and tests/test_packaging.py enforces that.
# Without it here, `uv run pytest tests/` would silently skip those tests.
#
# playwright is the same shape: it drives the viz page in a real browser
# (tests/browser/), it must never reach the distribution, and those tests skip
# themselves when it — or its chromium build — is absent.
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "numpy>=1.24",
    "playwright>=1.62.0",
]

# `live` marks tests that write to a real hosted mirror. They are double
# env-gated on top of this marker; CI runs `pytest -m "not live"`.
[tool.pytest.ini_options]
markers = ["live: writes to a real hosted mirror (double env-gated)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The skills ship as package data next to the module; `hypergraph skills install`
# copies them into ./.claude/skills (or ~/.claude/skills with --user). Symlinked
# references/ entries are materialized as real files at build time.
[tool.hatch.build.targets.wheel.force-include]
"tools/hypergraph.py" = "hypergraph_protocol.py"
"skills" = "hypergraph_protocol_data/skills"
"templates" = "hypergraph_protocol_data/templates"

# The wheel needs only the bundled module; the sdist also carries the viz sources
# and their bundler, so `tools/bundle_viz.py` can be re-run from a source release.
[tool.hatch.build.targets.sdist]
include = ["tools/hypergraph.py", "tools/bundle_viz.py", "tools/viz",
           "README.md", "SPEC.md", "LICENSE", "pyproject.toml",
           "skills", "templates", "backend"]
# `.claude/skills/hypergraph-*` are committed symlinks into `skills/` — the dogfooding
# install. Hatchling walks with `followlinks=True` and skips any directory whose
# (st_dev, st_ino) it has already seen, so it materialized the skills under `.claude/`
# and then dropped the real `skills/` tree as a duplicate: an sdist with no `skills/`
# at all, whose wheel build then fails on the force-include of it.
#
# `exclude` alone does NOT fix that. It filters files out of the *output*, but the
# walker still descends and still marks the inodes — so both copies disappear. The
# directory has to be pruned before descent, which is what `skip-excluded-dirs` does.
# Keep both lines together; either one alone produces a broken release.
skip-excluded-dirs = true
exclude = ["/.claude", "/research"]

[tool.uv]
package = false
